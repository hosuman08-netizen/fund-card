<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>이 공시 한 장</title>
<meta name="description" content="펀드/상품 공시 체크리스트"/>
<link rel="manifest" href="manifest.json"/>
<style>
:root{--bg:#0b0a10;--surf:#15131d;--gold:#67e8f9;--dim:#8a8398;--txt:#ece8f1;--line:#2a2438;--ok:#4ade80;--bad:#f87171}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,sans-serif;padding:18px 14px 56px;line-height:1.45;max-width:440px;margin:0 auto}
h1{font-size:1.4rem;color:var(--gold);font-weight:800}
.sub{color:var(--dim);font-size:12px;margin:6px 0 12px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.row{display:flex;gap:8px;flex-wrap:wrap}
button,.btn{border:0;border-radius:10px;padding:11px 14px;font-weight:700;cursor:pointer;background:var(--gold);color:#111;font-size:14px}
button.sec{background:#1c1826;color:var(--txt);border:1px solid var(--line)}
button:active{transform:scale(.98)}
input,select,textarea{width:100%;background:#0e0c14;border:1px solid var(--line);border-radius:10px;color:var(--txt);padding:10px;margin:6px 0;font-size:14px}
.bar{height:10px;background:#1c1826;border-radius:99px;overflow:hidden;margin:8px 0}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#fff3);width:0;transition:width .25s}
.chip{display:inline-block;padding:4px 8px;border-radius:999px;background:#1c1826;font-size:11px;color:var(--dim);margin:2px}
.chip b{color:var(--gold)}
.chip.warn{color:#fde68a}
.fs-grid{display:grid;gap:8px;margin-top:8px}
.fs-row{display:grid;grid-template-columns:88px 1fr auto;gap:8px;align-items:center}
.fs-row label{font-size:11px;color:var(--dim)}
.fs-row input{margin:0}
.fs-row .chip{min-width:52px;text-align:center}
.fs-foot{font-size:11px;color:var(--dim);margin-top:10px;line-height:1.55}
.pri-er{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.risk-item{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;cursor:pointer}
#out{font-size:13px;margin-top:8px;white-space:pre-wrap}
a{color:var(--gold)}
footer{text-align:center;color:var(--dim);font-size:11px;margin-top:22px;line-height:1.6}

</style></head><body>
<h1>이 공시 한 장</h1>
<p class="sub">펀드/상품 공시 체크리스트</p>
<div id="app"></div>

<footer>교육·기록 도구 · 투자 권유 아님 · Not financial advice<br>© Legion</footer>
<script>window.LEGION_APP='fund-card';window.LEGION_ANALYTICS_URL='https://legion-analytics.hoyashi95.workers.dev';</script>
<script src="legion-beacon.js"></script>
<script src="app.js"></script>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(function(){});}</script>
</body></html>
